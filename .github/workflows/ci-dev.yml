# create-repo 스타터 CI (dev) — PR 검증. 러너: ARC self-hosted.
name: ci-dev
on:
  pull_request:

jobs:
  build:
    runs-on: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --no-daemon
