# create-repo 스타터 CI (prod) — main 푸시 빌드. 러너: ARC self-hosted.
name: ci-prod
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: shoplive-default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --no-daemon
