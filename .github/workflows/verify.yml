# Package.swift integrity checks.
#  - PR / push: the manifest parses and the release-managed values are filled in
#               (a missing common-ios tag for commonVersion is only a warning here)
#  - Tag:       the tag matches sdkVersion, the common-ios tag exists and the release asset is attached
#
# Runner: GitHub-hosted macOS. Swap `runs-on` to move this onto a self-hosted mac runner.
name: verify

on:
  pull_request:
  push:
    branches: ['release/**']
    tags: ['[0-9]*']

jobs:
  manifest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump package manifest
        run: swift package dump-package > /dev/null

      - name: Check release-managed values
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^let sdkVersion[[:space:]]*= "(.*)"$/\1/p' Package.swift)
          echo "sdkVersion=$version"
          [ -n "$version" ] || { echo "::error::sdkVersion is empty"; exit 1; }

          if [ "$version" = "0.0.0" ]; then
            echo "::notice::No release cut yet (sdkVersion=0.0.0); skipping checksum checks."
            exit 0
          fi

          fail=0
          checksum=$(sed -nE 's/^let checksumPlayer[[:space:]]*= "(.*)"$/\1/p' Package.swift)
          if ! [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::checksumPlayer is not a 64-char hex checksum: '$checksum'"
            fail=1
          fi

          common=$(sed -nE 's/^let commonVersion[[:space:]]*= "(.*)"$/\1/p' Package.swift)
          echo "commonVersion=$common"
          if ! [[ "$common" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::commonVersion is not X.Y.Z: '$common'"
            fail=1
          elif ! git ls-remote --exit-code --tags https://github.com/shoplive/common-ios "refs/tags/$common" > /dev/null; then
            # common-ios is tagged before this repo, so a PR may land ahead of that tag.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::shoplive/common-ios has no tag $common"
              fail=1
            else
              echo "::warning::shoplive/common-ios has no tag $common yet; it must exist before this repo is tagged."
            fi
          fi
          exit $fail

      - name: Check tag matches sdkVersion
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^let sdkVersion[[:space:]]*= "(.*)"$/\1/p' Package.swift)
          tag="${GITHUB_REF_NAME}"
          [ "$version" = "$tag" ] \
            || { echo "::error::tag ($tag) does not match sdkVersion ($version)"; exit 1; }

      - name: Check the release asset exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          # Common binaries ship from shoplive/common-ios; only the player zip is attached here.
          grep -qx "ShopLiveSDK.xcframework.zip" <<< "$assets" \
            || { echo "::error::release is missing ShopLiveSDK.xcframework.zip"; exit 1; }
